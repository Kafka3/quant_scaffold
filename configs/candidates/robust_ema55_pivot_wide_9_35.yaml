strategy:
  stochastic:
    k_period: 14
    smooth: 1
    d_period: 3
    oversold: 15
    overbought: 85

  pivots:
    left_bars: 4
    right_bars: 3
    min_separation: 9
    max_separation: 35
    strict: true

  trend:
    ema_period: 55
    lookback_bars: 24
    min_close_ratio: 0.80

  risk:
    atr_period: 14
    rr_target: 2.2
    stop_buffer: 0.0

  setup:
    setup_max_bars: 12
    replace_same_side_setup: true
    invalidate_on_stop_anchor_break: true

backtest:
  initial_cash: 100000
  fee_rate: 0.0002
  slippage: 0.0
  allow_short: true

data:
  path: data/raw/BTCUSDT_5m_2024_2025.csv
