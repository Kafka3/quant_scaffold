data:
  path: data/raw/BTCUSDT_5m_2024.csv

strategy:
  stochastic:
    k_period: 21
    d_period: 5
    smooth: 3
    oversold: 17
    overbought: 75

  pivots:
    left_bars: 6
    right_bars: 5
    min_separation: 15
    max_separation: 31
    strict: true

  trend:
    ema_period: 82
    lookback_bars: 24
    min_close_ratio: 0.5124336224529857

  risk:
    atr_period: 14
    stop_buffer: 0.0
    rr_target: 3.136708485655296

  setup:
    setup_max_bars: 12
    replace_same_side_setup: true
    invalidate_on_stop_anchor_break: true

backtest:
  initial_cash: 100000
  fee_rate: 0.0002
  slippage: 0.0
  allow_short: true
